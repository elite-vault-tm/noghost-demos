<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoGhost Email Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e8e0d8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /*
  ─────────────────────────────────────────
  EMAIL HEADER — 600px wide
  This is the only element you screenshot.
  ─────────────────────────────────────────
  */
  .email-header-block {
    width: 600px;
    background: #2A1A1A;
    font-family: 'Manrope', Arial, sans-serif;
    overflow: hidden;
  }

  /* Top color bar */
  .color-bar {
    height: 5px;
    background: linear-gradient(90deg, #FF6B5B 0%, #FFA94D 50%, #FF6B5B 100%);
  }

  /* Inner padding */
  .header-inner {
    padding: 32px 40px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Logo row */
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  /* Ghost SVG icon */
  .ghost-icon {
    flex-shrink: 0;
  }

  /* Wordmark */
  .wordmark {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 32px;
    font-weight: 400;
    color: #FFF8EC;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .wordmark em {
    font-style: italic;
    color: #FF6B5B;
  }

  /* Tagline */
  .tagline {
    font-family: 'Manrope', Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 248, 236, 0.38);
    text-align: center;
  }

  /* Bottom accent line */
  .bottom-line {
    height: 1px;
    background: rgba(255, 169, 77, 0.18);
    margin: 20px 40px 0;
  }
</style>
</head>
<body>

<div class="email-header-block">

  <!-- Top coral-to-mango bar -->
  <div class="color-bar"></div>

  <!-- Logo + tagline -->
  <div class="header-inner">

    <div class="logo-row">

      <!-- Ghost icon -->
      <svg class="ghost-icon" width="38" height="42" viewBox="0 0 38 42" xmlns="http://www.w3.org/2000/svg">
        <circle cx="19" cy="16" r="16" fill="#FF6B5B"/>
        <rect x="3" y="16" width="32" height="16" fill="#FF6B5B"/>
        <ellipse cx="10" cy="32" rx="6" ry="7" fill="#2A1A1A"/>
        <ellipse cx="19" cy="33.5" rx="5.5" ry="6.5" fill="#2A1A1A"/>
        <ellipse cx="28" cy="32" rx="6" ry="7" fill="#2A1A1A"/>
        <circle cx="14" cy="13" r="4.5" fill="#2A1A1A"/>
        <circle cx="24" cy="13" r="4.5" fill="#2A1A1A"/>
        <circle cx="14" cy="13" r="2" fill="#FF6B5B"/>
        <circle cx="24" cy="13" r="2" fill="#FF6B5B"/>
      </svg>

      <!-- Wordmark -->
      <div class="wordmark">No<em>Ghost</em></div>

    </div>

    <!-- Tagline -->
    <div class="tagline">Custom Booking Pages &nbsp;·&nbsp; By The Elite Vault™</div>

  </div>

  <!-- Bottom subtle divider -->
  <div class="bottom-line"></div>

</div>

</body>
</html>
